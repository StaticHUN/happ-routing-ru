<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Happ Routing</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #1e1e2f; color: #fff; }
        textarea { width: 100%; height: 120px; background: #2d2d44; color: #fff; border: 1px solid #444; border-radius: 8px; padding: 10px; font-size: 14px; }
        button { background: #3498db; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background: #2980b9; }
        .success { color: #51cf66; }
        .error { color: #ff6b6b; }
    </style>
</head>
<body>
    <h1>⚙️ Happ Routing</h1>
    <p>Нажмите кнопку "Открыть в Happ" для автодобавления правил или скопируйте строку ниже и вставьте её в приложение:</p>
    <textarea id="base64Output" readonly>Загрузка...</textarea>
    <br>
    <button onclick="window.location.href=document.getElementById('base64Output').value">📲 Открыть в Happ</button>
    <button onclick="copyToClipboard()">📋 Скопировать</button>
	<p id="status"></p>

    <script>
        const JSON_URL = 'https://github.com/StaticHUN/happ-routing-ru/raw/refs/heads/rue/rules.json';

        async function loadRules() {
            try {
                const response = await fetch(JSON_URL);
                if (!response.ok) throw new Error('Не удалось загрузить правила');
                const data = await response.json();
                const jsonString = JSON.stringify(data);
                const base64 = btoa(unescape(encodeURIComponent(jsonString)));
				const fullLink = 'happ://routing/add/' + base64;
                document.getElementById('base64Output').value = fullLink;
                document.getElementById('status').innerHTML = '<span class="success">✅ Правила загружены</span>';
            } catch (error) {
                document.getElementById('base64Output').value = 'Ошибка загрузки';
                document.getElementById('status').innerHTML = `<span class="error">❌ ${error.message}</span>`;
            }
        }

        function copyToClipboard() {
            const textarea = document.getElementById('base64Output');
            textarea.select();
            document.execCommand('copy');
            document.getElementById('status').innerHTML = '<span class="success">✅ Скопировано!</span>';
        }

        loadRules();
    </script>
</body>
</html>
