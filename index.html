<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Установка правил маршрутизации</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #1e1e2f; color: #fff; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .error { color: #ff6b6b; }
        .success { color: #51cf66; }
    </style>
</head>
<body>
    <h1>🔄 Установка правил маршрутизации</h1>
    <div class="loader" id="loader"></div>
    <p id="status">Загрузка актуальных правил...</p>

    <script>
        const JSON_URL = 'https://raw.githubusercontent.com/StaticHUN/happ-routing-ru/refs/heads/rue/rules.json';

        async function fetchAndRedirect() {
            try {
                const response = await fetch(JSON_URL);
                if (!response.ok) throw new Error('Не удалось загрузить правила');
                const data = await response.json();

                const jsonString = JSON.stringify(data);
                const base64 = btoa(unescape(encodeURIComponent(jsonString))); // корректная обработка Unicode

                const redirectUrl = `happ://routing/add/${base64}`;
                document.getElementById('status').innerHTML = `<span class="success">✅ Правила загружены, перенаправление...</span>`;
                document.getElementById('loader').style.display = 'none';

                setTimeout(() => {
                    window.location.href = redirectUrl;
                }, 500);
            } catch (error) {
                document.getElementById('status').innerHTML = `<span class="error">❌ Ошибка: ${error.message}</span>`;
                document.getElementById('loader').style.display = 'none';
            }
        }

        fetchAndRedirect();
    </script>
</body>
</html>
